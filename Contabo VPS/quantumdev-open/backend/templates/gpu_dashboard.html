<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Monitoring Dashboard - A6000 48GB</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        
        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .card-icon {
            font-size: 24px;
            margin-right: 12px;
        }
        
        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #444;
        }
        
        .metric {
            margin-bottom: 12px;
        }
        
        .metric-label {
            font-size: 13px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        
        .metric-value {
            font-size: 24px;
            font-weight: 700;
            color: #333;
        }
        
        .metric-unit {
            font-size: 14px;
            color: #888;
            font-weight: 400;
        }
        
        .progress-bar {
            width: 100%;
            height: 24px;
            background: #f0f0f0;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 8px;
            position: relative;
        }
        
        .progress-fill {
            height: 100%;
            transition: width 0.5s ease, background-color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }
        
        .progress-fill.good {
            background: linear-gradient(90deg, #4CAF50, #66BB6A);
        }
        
        .progress-fill.warning {
            background: linear-gradient(90deg, #FF9800, #FFB74D);
        }
        
        .progress-fill.critical {
            background: linear-gradient(90deg, #F44336, #EF5350);
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .status-online {
            background: #4CAF50;
            color: white;
        }
        
        .status-offline {
            background: #F44336;
            color: white;
        }
        
        .status-cached {
            background: #2196F3;
            color: white;
        }
        
        .status-unknown {
            background: #9E9E9E;
            color: white;
        }
        
        .alerts-container {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .alert-item {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            border-left: 4px solid;
        }
        
        .alert-item.warning {
            background: #FFF3E0;
            border-color: #FF9800;
        }
        
        .alert-item.critical {
            background: #FFEBEE;
            border-color: #F44336;
        }
        
        .alert-item.info {
            background: #E3F2FD;
            border-color: #2196F3;
        }
        
        .alert-time {
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
        }
        
        .alert-message {
            font-size: 14px;
            color: #333;
        }
        
        .no-alerts {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 16px;
        }
        
        .last-update {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 14px;
            opacity: 0.9;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }
        
        .error {
            background: #FFEBEE;
            border: 2px solid #F44336;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            color: #B71C1C;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖥️ GPU Monitoring Dashboard</h1>
        
        <div id="loading" class="loading">
            <div class="pulse">Loading GPU metrics...</div>
        </div>
        
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="dashboard" style="display: none;">
            <div class="dashboard-grid">
                <div class="card">
                    <div class="card-header">
                        <span class="card-icon">🔧</span>
                        <span class="card-title">GPU Status</span>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Device</div>
                        <div class="metric-value" id="gpu-name">-</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Status</div>
                        <div id="gpu-status-badge">-</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Monitoring Mode</div>
                        <div class="metric-value" style="font-size: 16px;" id="gpu-mode">-</div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <span class="card-icon">💾</span>
                        <span class="card-title">VRAM Usage</span>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Used / Total</div>
                        <div class="metric-value">
                            <span id="vram-used">0</span> / <span id="vram-total">0</span>
                            <span class="metric-unit">GB</span>
                        </div>
                    </div>
                    <div class="progress-bar">
                        <div id="vram-progress" class="progress-fill good" style="width: 0%;">0%</div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <span class="card-icon">⚡</span>
                        <span class="card-title">GPU Utilization</span>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Compute Load</div>
                        <div class="metric-value">
                            <span id="gpu-util">0</span>
                            <span class="metric-unit">%</span>
                        </div>
                    </div>
                    <div class="progress-bar">
                        <div id="util-progress" class="progress-fill good" style="width: 0%;">0%</div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <span class="card-icon">🌡️</span>
                        <span class="card-title">Temperature</span>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Current</div>
                        <div class="metric-value">
                            <span id="gpu-temp">0</span>
                            <span class="metric-unit">°C</span>
                        </div>
                    </div>
                    <div class="progress-bar">
                        <div id="temp-progress" class="progress-fill good" style="width: 0%;">0°C</div>
                    </div>
                </div>
            </div>
            
            <div class="alerts-container">
                <div class="card-header">
                    <span class="card-icon">🚨</span>
                    <span class="card-title">Recent Alerts (Last 24 Hours)</span>
                </div>
                <div id="alerts-list"></div>
            </div>
            
            <div class="last-update">
                Last updated: <span id="last-update-time">-</span>
            </div>
        </div>
    </div>
    
    <script>
        // Server-Sent Events connection
        let eventSource = null;
        let updateInterval = null;
        
        function formatBytes(bytes) {
            return (bytes / (1024 ** 3)).toFixed(2);
        }
        
        function formatTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString();
        }
        
        function getProgressClass(value, warningThreshold, criticalThreshold) {
            if (value >= criticalThreshold) return 'critical';
            if (value >= warningThreshold) return 'warning';
            return 'good';
        }
        
        function updateDashboard(data) {
            const dashboard = document.getElementById('dashboard');
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            
            loading.style.display = 'none';
            error.style.display = 'none';
            dashboard.style.display = 'block';
            
            const current = data.current || {};
            const gpus = current.gpus || [];
            const health = data.health || {};
            
            if (gpus.length === 0) {
                error.textContent = 'No GPU detected or monitoring error: ' + (current.error || 'unknown');
                error.style.display = 'block';
                dashboard.style.display = 'none';
                return;
            }
            
            const gpu = gpus[0]; // First GPU
            
            // Update GPU name and status
            document.getElementById('gpu-name').textContent = gpu.name || 'Unknown';
            
            const statusBadge = document.getElementById('gpu-status-badge');
            const status = current.status || 'unknown';
            statusBadge.className = 'status-badge status-' + status;
            statusBadge.textContent = status.toUpperCase();
            
            const mode = current.monitoring_mode || 'unknown';
            document.getElementById('gpu-mode').textContent = mode.toUpperCase();
            
            // Update VRAM
            const vramUsed = formatBytes(gpu.memory_used || 0);
            const vramTotal = formatBytes(gpu.memory_total || 0);
            const vramPercent = gpu.memory_percent || 0;
            
            document.getElementById('vram-used').textContent = vramUsed;
            document.getElementById('vram-total').textContent = vramTotal;
            
            const vramProgress = document.getElementById('vram-progress');
            vramProgress.style.width = vramPercent + '%';
            vramProgress.textContent = vramPercent.toFixed(1) + '%';
            vramProgress.className = 'progress-fill ' + getProgressClass(vramPercent, 90, 95);
            
            // Update Utilization
            const util = gpu.utilization_percent || 0;
            document.getElementById('gpu-util').textContent = util.toFixed(1);
            
            const utilProgress = document.getElementById('util-progress');
            utilProgress.style.width = util + '%';
            utilProgress.textContent = util.toFixed(1) + '%';
            utilProgress.className = 'progress-fill good';
            
            // Update Temperature
            const temp = gpu.temperature || 0;
            document.getElementById('gpu-temp').textContent = temp.toFixed(1);
            
            const tempProgress = document.getElementById('temp-progress');
            const tempPercent = Math.min((temp / 100) * 100, 100); // Scale to 100°C max for display
            tempProgress.style.width = tempPercent + '%';
            tempProgress.textContent = temp.toFixed(1) + '°C';
            tempProgress.className = 'progress-fill ' + getProgressClass(temp, 80, 85);
            
            // Update last update time
            const timestamp = current.timestamp || new Date().toISOString();
            document.getElementById('last-update-time').textContent = formatTime(timestamp);
        }
        
        function updateAlerts(data) {
            const alertsList = document.getElementById('alerts-list');
            
            // Fetch alerts from separate endpoint
            fetch('/system/gpu/alerts?hours=24')
                .then(response => response.json())
                .then(alertData => {
                    const history = alertData.history || [];
                    const active = alertData.active_alerts || [];
                    
                    // Combine active and history, sort by time
                    const allAlerts = [...active, ...history].sort((a, b) => {
                        const timeA = a.triggered_at || 0;
                        const timeB = b.triggered_at || 0;
                        return timeB - timeA; // Most recent first
                    });
                    
                    if (allAlerts.length === 0) {
                        alertsList.innerHTML = '<div class="no-alerts">✅ No alerts in the last 24 hours</div>';
                        return;
                    }
                    
                    alertsList.innerHTML = '';
                    
                    allAlerts.slice(0, 20).forEach(alert => { // Show last 20
                        const div = document.createElement('div');
                        div.className = 'alert-item ' + alert.level;
                        
                        const time = document.createElement('div');
                        time.className = 'alert-time';
                        time.textContent = formatTime(alert.triggered_at_iso);
                        
                        const message = document.createElement('div');
                        message.className = 'alert-message';
                        
                        if (alert.resolved) {
                            message.textContent = '✅ RESOLVED: ' + alert.message;
                            div.className = 'alert-item info';
                        } else {
                            message.textContent = alert.message;
                        }
                        
                        div.appendChild(time);
                        div.appendChild(message);
                        alertsList.appendChild(div);
                    });
                })
                .catch(err => {
                    console.error('Error fetching alerts:', err);
                    alertsList.innerHTML = '<div class="no-alerts">❌ Error loading alerts</div>';
                });
        }
        
        function fetchGPUStatus() {
            fetch('/system/gpu?history_minutes=60')
                .then(response => response.json())
                .then(data => {
                    updateDashboard(data);
                    updateAlerts(data);
                })
                .catch(err => {
                    console.error('Error fetching GPU status:', err);
                    const error = document.getElementById('error');
                    error.textContent = 'Error connecting to GPU monitoring API: ' + err.message;
                    error.style.display = 'block';
                    document.getElementById('loading').style.display = 'none';
                });
        }
        
        // Initial fetch
        fetchGPUStatus();
        
        // Update every 10 seconds
        updateInterval = setInterval(fetchGPUStatus, 10000);
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (eventSource) {
                eventSource.close();
            }
            if (updateInterval) {
                clearInterval(updateInterval);
            }
        });
    </script>
</body>
</html>
