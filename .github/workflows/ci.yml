name: CI - Code Quality and Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint with Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      
      - name: Lint with ruff
        run: |
          ruff check .

  format:
    name: Format Check with Black
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black
      
      - name: Check formatting with black
        run: |
          black --check .

  test:
    name: Run Tests with Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ -v --tb=short --cov=core --cov=backend --cov-report=term-missing --cov-report=xml --cov-fail-under=80
        env:
          ENABLE_L2_CACHE: "0"
          OPENAI_API_KEY: "test-key-for-mocking"
        continue-on-error: true
      
      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --tb=short
        env:
          ENABLE_L2_CACHE: "0"
          OPENAI_API_KEY: "test-key-for-mocking"
        continue-on-error: true
      
      - name: Upload coverage report
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7
      
      - name: Coverage report summary
        if: matrix.python-version == '3.10'
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See uploaded artifact for detailed coverage report." >> $GITHUB_STEP_SUMMARY

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit safety
          pip install -r requirements.txt || true
      
      - name: Run pip-audit
        run: |
          pip-audit --desc
        continue-on-error: true  # Allow to continue but report issues

      - name: Run safety check
        run: |
          safety check --json
        continue-on-error: true  # Allow to continue but report issues
